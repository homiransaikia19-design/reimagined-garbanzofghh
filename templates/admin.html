<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Control Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
        }

        /* Glassmorphism Panel Base */
        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Forms */
        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button.secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
        }
        
        button.secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* API Endpoints Section (White Code Blocks) */
        .endpoint-box {
            background: #ffffff;
            color: #1e293b;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
        }

        .endpoint-method {
            display: inline-block;
            background: #10b981;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-right: 8px;
        }

        .endpoint-url {
            font-weight: 600;
        }

        .endpoint-desc {
            margin-top: 8px;
            color: #64748b;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
        }

        /* Tables */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        th {
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-active {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-expired {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .traffic-counter {
            font-weight: 700;
            color: var(--primary);
        }

        /* Notifications */
        .notification {
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            font-size: 0.9rem;
            display: none;
        }
        
        .notification.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--success);
            display: block;
        }

        /* Layout tweaks */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .code-highlight {
            background: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            color: #0f172a;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- LEFT SIDEBAR: Creation & Endpoints -->
        <div>
            <div class="panel" style="margin-bottom: 2rem;">
                <h1>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    API Control
                </h1>
                
                <div class="form-group">
                    <label>Admin Password</label>
                    <input type="password" id="adminPass" value="admin123">
                </div>

                <h2 style="margin-top: 2rem;">Create API Key</h2>
                <div class="form-group">
                    <label>Client Name</label>
                    <input type="text" id="clientName" placeholder="e.g., Mobile App v1">
                </div>
                <div class="form-group">
                    <label>Validity (Days)</label>
                    <input type="number" id="validity" value="30" min="1">
                </div>
                <button onclick="createKey()">Generate Key</button>
                <div id="createResult" class="notification"></div>
            </div>

            <!-- API Endpoints Section -->
            <div class="panel">
                <h2>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                    API Endpoints
                </h2>
                
                <div class="endpoint-box">
                    <div>
                        <span class="endpoint-method">GET</span>
                        <span class="endpoint-url">/api/infonumber</span>
                    </div>
                    <div class="endpoint-desc">
                        Search for a user by phone number. <br><br>
                        <b>Query Params:</b> <span class="code-highlight">?number=XXXX</span><br>
                        <b>Headers:</b> <span class="code-highlight">x-api-key: YOUR_KEY</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT SIDE: Traffic & Management -->
        <div class="main-content">
            <div class="panel" style="height: 100%;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h2>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                        API Usage & Traffic
                    </h2>
                    <button class="secondary" onclick="loadKeys()" style="width: auto; padding: 0.5rem 1rem;">
                        ↻ Refresh Data
                    </button>
                </div>

                <div class="table-container">
                    <table id="keysTable">
                        <thead>
                            <tr>
                                <th>Client</th>
                                <th>API Key</th>
                                <th>Expires</th>
                                <th>Status</th>
                                <th>Traffic</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data loads here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        async function createKey() {
            const name = document.getElementById('clientName').value;
            const days = document.getElementById('validity').value;
            const pass = document.getElementById('adminPass').value;
            const resultDiv = document.getElementById('createResult');

            if(!name) { 
                resultDiv.className = "notification"; 
                alert("Please enter a client name"); 
                return; 
            }

            resultDiv.className = "notification";
            resultDiv.style.display = "none";

            const response = await fetch(`/admin/generate_key?owner_name=${name}&validity_days=${days}&admin_pass=${pass}`, {
                method: 'POST'
            });
            const data = await response.json();

            if(response.ok) {
                resultDiv.className = "notification success";
                resultDiv.innerHTML = `Key Created!<br><br><strong style="font-family:monospace; font-size:1.1em; color:#fff;">${data.api_key}</strong>`;
                loadKeys();
            } else {
                alert("Error: " + data.detail);
            }
        }

        async function loadKeys() {
            const pass = document.getElementById('adminPass').value;
            const tbody = document.querySelector('#keysTable tbody');
            
            const response = await fetch(`/admin/get_keys?admin_pass=${pass}`);
            const data = await response.json();

            if(!response.ok) {
                alert("Wrong admin password!");
                return;
            }

            tbody.innerHTML = "";
            // Sort keys by highest traffic
            data.sort((a, b) => b.total_requests - a.total_requests);

            data.forEach(key => {
                const isExpired = new Date(key.expires_at) < new Date();
                const statusHTML = (key.is_active && !isExpired) 
                    ? `<span class="status-badge status-active">Active</span>` 
                    : `<span class="status-badge status-expired">Expired</span>`;
                
                const expDate = new Date(key.expires_at).toLocaleDateString(undefined, { 
                    month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' 
                });
                
                tbody.innerHTML += `
                    <tr>
                        <td><b>${key.owner_name}</b></td>
                        <td><code style="background:rgba(0,0,0,0.3); padding:4px 8px; border-radius:4px; color:#93c5fd;">${key.key_string.substring(0, 12)}...</code></td>
                        <td style="color:var(--text-muted); font-size:0.85rem;">${expDate}</td>
                        <td>${statusHTML}</td>
                        <td class="traffic-counter">${key.total_requests} <span style="font-size:0.8em; font-weight:normal; color:var(--text-muted);">hits</span></td>
                    </tr>
                `;
            });
        }
        
        // Load keys on start
        window.onload = loadKeys;
    </script>
</body>
                      </html>
